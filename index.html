<title>Made in Jordan</title>

<style>
/* Layout: Apple-style. A slim translucent nav, huge centred headlines, bento grids and horizontal shelves.
   Liquid-glass cards float over a slowly drifting colour field; photos carry the products. */
:root {
  --bg: #F5F5F7;
  --ink: #1D1D1F;
  --ink-2: #424245;
  --muted: #6E6E73;
  --line: rgba(0, 0, 0, .08);
  --line-2: rgba(0, 0, 0, .15);
  --green: #0A8754;
  --green-2: #0E9F74;
  --green-hover: #087346;
  --green-wash: rgba(10, 135, 84, .09);
  --gold: #B8862F;
  --red: #CE1126;
  --on-accent: #FFFFFF;
  --glass-a: rgba(255, 255, 255, .66);
  --glass-b: rgba(255, 255, 255, .38);
  --glass-edge: rgba(255, 255, 255, .8);
  --glass-hi: rgba(255, 255, 255, .95);
  --glass-solid: rgba(255, 255, 255, .86);
  --glass-shadow: 0 1px 1px rgba(0, 0, 0, .03), 0 22px 50px -24px rgba(20, 50, 35, .32);
  --specular: rgba(255, 255, 255, .55);
  --nav-bg: rgba(245, 245, 247, .74);
  --ribbon-bg: rgba(232, 232, 237, .9);
  --blob-1: #86DDB0;
  --blob-2: #F4D39A;
  --blob-3: #9BD8EC;
  --blob-4: #F6B2A6;
  --blob-op: .62;
  --band-bg: #07120D;
  --band-ink: #F5F5F7;
  --band-muted: #A1A1A6;
  --band-glass: rgba(255, 255, 255, .07);
  --band-edge: rgba(255, 255, 255, .14);
  --photo-shade: linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, .05) 45%, rgba(0, 0, 0, .35) 100%);
  --gap: #C4291D;
  --gap-soft: rgba(196, 41, 29, .1);
  --thin: #9A6100;
  --thin-soft: rgba(214, 150, 20, .14);
  --ok: #138A4F;
  --ok-soft: rgba(19, 138, 79, .11);
  --seq-1: #A6DDBF;
  --seq-2: #34A874;
  --seq-3: #0A7A4C;
  --water: #93C9DD;
  --tile-s: 40%;
  --tile-l1: 90%;
  --tile-l2: 80%;
  --tile-ink: 28%;
  --r-xl: 32px;
  --r-lg: 26px;
  --r-md: 18px;
  --r-sm: 12px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --f-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "IBM Plex Sans Arabic", "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --ink: #F5F5F7; --ink-2: #D2D2D7; --muted: #8E8E93; --line: rgba(255, 255, 255, .1); --line-2: rgba(255, 255, 255, .2);
    --green: #32D28C; --green-2: #3EDBB6; --green-hover: #5BE0A4; --green-wash: rgba(50, 210, 140, .12); --gold: #E6C27A; --red: #FF4F63; --on-accent: #03140B;
    --glass-a: rgba(44, 44, 48, .58); --glass-b: rgba(28, 28, 32, .34); --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .16); --glass-solid: rgba(30, 30, 33, .9);
    --glass-shadow: 0 1px 1px rgba(0, 0, 0, .5), 0 26px 60px -26px rgba(0, 0, 0, .9); --specular: rgba(255, 255, 255, .14);
    --nav-bg: rgba(18, 18, 20, .72); --ribbon-bg: rgba(29, 29, 31, .92);
    --blob-1: #0B7048; --blob-2: #6E4F17; --blob-3: #0C5068; --blob-4: #61202D; --blob-op: .5;
    --gap: #FF8A80; --gap-soft: rgba(255, 138, 128, .14); --thin: #F5C451; --thin-soft: rgba(245, 196, 81, .14); --ok: #63DA9D; --ok-soft: rgba(99, 218, 157, .13);
    --seq-1: #2A5F45; --seq-2: #36AC78; --seq-3: #93E8BC; --water: #23566A;
    --tile-s: 26%; --tile-l1: 22%; --tile-l2: 14%; --tile-ink: 76%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --ink: #F5F5F7; --ink-2: #D2D2D7; --muted: #8E8E93; --line: rgba(255, 255, 255, .1); --line-2: rgba(255, 255, 255, .2);
  --green: #32D28C; --green-2: #3EDBB6; --green-hover: #5BE0A4; --green-wash: rgba(50, 210, 140, .12); --gold: #E6C27A; --red: #FF4F63; --on-accent: #03140B;
  --glass-a: rgba(44, 44, 48, .58); --glass-b: rgba(28, 28, 32, .34); --glass-edge: rgba(255, 255, 255, .13); --glass-hi: rgba(255, 255, 255, .16); --glass-solid: rgba(30, 30, 33, .9);
  --glass-shadow: 0 1px 1px rgba(0, 0, 0, .5), 0 26px 60px -26px rgba(0, 0, 0, .9); --specular: rgba(255, 255, 255, .14);
  --nav-bg: rgba(18, 18, 20, .72); --ribbon-bg: rgba(29, 29, 31, .92);
  --blob-1: #0B7048; --blob-2: #6E4F17; --blob-3: #0C5068; --blob-4: #61202D; --blob-op: .5;
  --gap: #FF8A80; --gap-soft: rgba(255, 138, 128, .14); --thin: #F5C451; --thin-soft: rgba(245, 196, 81, .14); --ok: #63DA9D; --ok-soft: rgba(99, 218, 157, .13);
  --seq-1: #2A5F45; --seq-2: #36AC78; --seq-3: #93E8BC; --water: #23566A;
  --tile-s: 26%; --tile-l1: 22%; --tile-l2: 14%; --tile-ink: 76%;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body {
  margin: 0; min-height: 100vh; overflow-x: clip;
  font: 400 17px/1.47 var(--f-sans);
  letter-spacing: -.01em;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
body:lang(ar) { letter-spacing: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--nav-bg); }
body.touring { padding-bottom: 200px; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
img.broken { visibility: hidden; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; overflow-wrap: break-word; font-weight: 700; }
h1 { font-size: clamp(36px, 5.6vw, 72px); line-height: 1.04; letter-spacing: -.035em; }
h2 { font-size: clamp(30px, 4.2vw, 56px); line-height: 1.07; letter-spacing: -.03em; }
h3 { font-size: 21px; line-height: 1.2; letter-spacing: -.015em; font-weight: 600; }
:lang(ar) h1, :lang(ar) h2, :lang(ar) h3 { letter-spacing: 0; line-height: 1.3; }
:lang(zh) h1, :lang(ja) h1, :lang(zh) h2, :lang(ja) h2 { letter-spacing: 0; line-height: 1.2; }
p { margin: 0; }
.wrap { max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kicker { font-size: 17px; font-weight: 600; color: var(--green); letter-spacing: -.01em; }
.lead { font-size: clamp(17px, 1.6vw, 21px); line-height: 1.4; color: var(--muted); max-width: 46ch; font-weight: 500; letter-spacing: -.015em; }
.muted { color: var(--muted); }
.small { font-size: 14px; letter-spacing: -.005em; }
.mono { font-family: var(--f-mono); font-size: .9em; letter-spacing: 0; }
.grad { background: linear-gradient(100deg, var(--green) 0%, var(--green-2) 45%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
[dir="rtl"] .flip-rtl { transform: scaleX(-1); }

/* Drifting colour field behind the glass */
.aura { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aura i { position: absolute; width: 62vmax; height: 62vmax; border-radius: 50%; filter: blur(90px); opacity: var(--blob-op); will-change: transform; }
.aura i:nth-child(1) { background: var(--blob-1); top: -26vmax; left: -14vmax; animation: drift-a 28s ease-in-out infinite alternate; }
.aura i:nth-child(2) { background: var(--blob-2); top: 10vmax; right: -24vmax; animation: drift-b 34s ease-in-out infinite alternate; }
.aura i:nth-child(3) { background: var(--blob-3); bottom: -30vmax; left: 12vmax; animation: drift-c 31s ease-in-out infinite alternate; }
.aura i:nth-child(4) { background: var(--blob-4); top: 34vmax; left: -22vmax; width: 40vmax; height: 40vmax; opacity: calc(var(--blob-op) * .6); animation: drift-b 38s ease-in-out infinite alternate-reverse; }
@keyframes drift-a { to { transform: translate(22vmax, 14vmax) scale(1.18); } }
@keyframes drift-b { to { transform: translate(-18vmax, 16vmax) scale(.86); } }
@keyframes drift-c { to { transform: translate(14vmax, -20vmax) scale(1.12); } }

/* Liquid glass */
.glass {
  position: relative;
  background: linear-gradient(150deg, var(--glass-a), var(--glass-b));
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-lg);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow);
}
.tilt { transform: perspective(1100px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px)); transition: transform .6s var(--ease), box-shadow .4s var(--ease), border-color .3s; }
.tilt::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(520px circle at var(--mx, 50%) var(--my, -20%), var(--specular), transparent 42%); opacity: 0; transition: opacity .35s; z-index: 2; }
.tilt:hover { --lift: -6px; transition: transform .18s ease-out, box-shadow .4s var(--ease); }
.tilt:hover::after { opacity: 1; }
.pill-glass { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--glass-a); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi); }
.pill-glass .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-wash); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 8px transparent; } }

/* Buttons, chips, pills */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent; font-weight: 500; font-size: 16px; white-space: nowrap; transition: background .2s, border-color .2s, transform .2s var(--ease), box-shadow .3s; }
.btn:active { transform: scale(.97); }
.btn .icon { width: 18px; height: 18px; }
.btn-primary { background: var(--green); color: var(--on-accent); box-shadow: 0 8px 24px -10px var(--green); }
.btn-primary:hover { background: var(--green-hover); }
.btn-glass { background: var(--glass-a); border-color: var(--glass-edge); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 var(--glass-hi); }
.btn-glass:hover { color: var(--green); }
.btn-sm { min-height: 36px; padding: 0 16px; font-size: 14px; }
.link-more { display: inline-flex; align-items: center; gap: 4px; color: var(--green); font-weight: 500; background: none; border: 0; padding: 0; font-size: 17px; }
.link-more:hover { text-decoration: underline; }
.link-more .icon { width: 16px; height: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; background: var(--green-wash); color: var(--ink-2); white-space: nowrap; letter-spacing: -.005em; }
.chip .icon { width: 14px; height: 14px; }
.chip-btn { cursor: pointer; border: 1px solid var(--glass-edge); background: var(--glass-a); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); min-height: 36px; padding: 0 15px; font-size: 14px; transition: all .2s; }
.chip-btn:hover, .chip-btn[aria-pressed="true"] { border-color: var(--green); color: var(--green); background: var(--green-wash); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--green); }
.badge .icon { width: 16px; height: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill .icon { width: 14px; height: 14px; stroke-width: 2.2; }
.pill-gap { background: var(--gap-soft); color: var(--gap); }
.pill-thin { background: var(--thin-soft); color: var(--thin); }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-green { background: var(--green-wash); color: var(--green); }
.pill-sand { background: var(--thin-soft); color: var(--thin); }
.pill-ink { background: var(--line); color: var(--ink-2); }

/* Ribbon and nav */
.ribbon { background: var(--ribbon-bg); font-size: 12px; color: var(--ink-2); letter-spacing: 0; }
.ribbon .wrap { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; padding-block: 7px; text-align: center; }
.ribbon button { background: none; border: 0; padding: 0; color: var(--green); font-size: 12px; font-weight: 500; }
.ribbon button:hover, .ribbon button[aria-current="page"] { text-decoration: underline; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--nav-bg); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 18px; height: 56px; }
.brand { display: flex; align-items: center; gap: 9px; flex: none; font-weight: 600; font-size: 16px; letter-spacing: -.02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(150deg, #19A266, #075A37); display: grid; place-items: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 4px 12px -4px rgba(7, 90, 55, .6); }
.brand-mark svg { width: 19px; height: 19px; }
.nav-links { display: flex; gap: 2px; margin-inline: auto; }
.nav-links button { background: none; border: 0; padding: 7px 12px; border-radius: 999px; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; letter-spacing: -.005em; transition: color .2s, background .2s; }
.nav-links button:hover { color: var(--ink); }
.nav-links button[aria-current="page"] { color: var(--ink); background: var(--line); }
.controls { display: flex; align-items: center; gap: 8px; margin-inline-start: auto; }
.nav-links + .controls { margin-inline-start: 0; }
.select { appearance: none; -webkit-appearance: none; height: 34px; padding-block: 0; padding-inline: 12px 28px; border-radius: 999px; border: 1px solid var(--line-2); background-color: transparent; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-size: 5px 5px; background-repeat: no-repeat; background-position: calc(100% - 15px) 54%, calc(100% - 10px) 54%; font-size: 13px; font-weight: 500; }
[dir="rtl"] .select { background-position: 15px 54%, 10px 54%; }
.select option { color: #1D1D1F; }
.seg { display: inline-flex; border-radius: 999px; padding: 2px; background: var(--line); }
.seg button { border: 0; background: none; height: 30px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); transition: all .25s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--glass-solid); color: var(--ink); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
.tour-btn { height: 34px; min-height: 34px; padding: 0 14px; font-size: 13px; }
.menu-btn { display: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--line); align-items: center; justify-content: center; }
.sheet { display: none; }
@media (max-width: 1080px) {
  .nav-links { display: none; }
  .nav-links + .controls { margin-inline-start: auto; }
  .menu-btn { display: inline-flex; }
  .sheet[data-open="true"] { display: block; border-top: 1px solid var(--line); animation: sheet .35s var(--ease); }
  .sheet .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-block: 14px 18px; }
  .sheet button { text-align: start; background: var(--glass-a); border: 1px solid var(--glass-edge); border-radius: 14px; padding: 13px 15px; font-weight: 500; font-size: 15px; }
  .sheet button[aria-current="page"], .sheet button[aria-pressed="true"] { border-color: var(--green); color: var(--green); }
}
@keyframes sheet { from { opacity: 0; transform: translateY(-8px); } }
@media (max-width: 720px) { .controls .seg, .controls .tour-btn span { display: none; } .tour-btn { padding: 0 11px; } }
@media (max-width: 400px) { .brand-name { display: none; } }

/* Sections */
.section { padding-block: clamp(48px, 7vw, 96px); }
.section-tight { padding-block: clamp(32px, 4vw, 56px); }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: clamp(24px, 3vw, 40px); }
.section-head > div { display: grid; gap: 10px; min-width: 0; max-width: 760px; }
.section-head.center { justify-content: center; text-align: center; }
.section-head.center > div { justify-items: center; }
.page-head { padding-block: clamp(40px, 6vw, 80px) 12px; display: grid; gap: 14px; }
.page-head.center { justify-items: center; text-align: center; }
.page-head.center .lead { max-width: 52ch; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; color: var(--green); background: none; border: 0; padding: 0; }
.back:hover { text-decoration: underline; }
.back .icon { width: 16px; height: 16px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 960px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } }
.card { padding: 26px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.ico-ball { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, var(--green-2), var(--green)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 10px 24px -10px var(--green); }
.ico-ball .icon { width: 24px; height: 24px; stroke-width: 1.8; }
.ico-ball.gold { background: linear-gradient(145deg, #E2B866, #A8741E); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 10px 24px -10px #A8741E; }
.ico-ball.teal { background: linear-gradient(145deg, #3BC3D4, #13738A); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 10px 24px -10px #13738A; }
.ico-ball.ink { background: linear-gradient(145deg, #4A4A4F, #1D1D1F); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 10px 24px -10px #000; }

/* Scroll reveal: starts visible but soft, settles into place */
[data-reveal].pre { opacity: .14; translate: 0 44px; scale: .97; filter: blur(6px); }
[data-reveal].in { opacity: 1; translate: 0 0; scale: 1; filter: none; transition: opacity 1s var(--ease) var(--d, 0ms), translate 1.1s var(--ease) var(--d, 0ms), scale 1.1s var(--ease) var(--d, 0ms), filter .9s var(--ease) var(--d, 0ms); }

/* Hero */
.hero { position: relative; padding-top: clamp(48px, 8vw, 110px); }
.hero-inner { display: grid; justify-items: center; text-align: center; gap: 22px; }
.hero-title { font-size: clamp(42px, 7.6vw, 104px); line-height: 1.02; letter-spacing: -.045em; max-width: 13ch; }

:lang(de) .hero-title, :lang(ru) .hero-title, :lang(fr) .hero-title, :lang(es) .hero-title, :lang(it) .hero-title, :lang(tr) .hero-title { font-size: clamp(38px, 6.6vw, 90px); max-width: 15ch; }
:lang(zh) .hero-title, :lang(ja) .hero-title { letter-spacing: 0; max-width: 12em; font-size: clamp(36px, 6vw, 80px); }
.hl { display: inline-block; animation: rise 1.2s var(--ease) both; }
.hl.b { animation-delay: .14s; }
@keyframes rise { from { opacity: .35; filter: blur(8px); transform: translateY(.2em) scale(.985); } }
.hero-sub { max-width: 40ch; animation: rise 1.2s var(--ease) .26s both; }
.hero .search { width: min(640px, 100%); animation: rise 1.2s var(--ease) .36s both; }
.search { display: flex; align-items: center; gap: 8px; padding: 6px; padding-inline-start: 18px; border-radius: 999px; }
.search .icon { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; min-height: 46px; }
.search input::placeholder { color: var(--muted); }
.search:focus-within { box-shadow: inset 0 1px 0 var(--glass-hi), 0 0 0 4px var(--green-wash), var(--glass-shadow); }
.popular { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; animation: rise 1.2s var(--ease) .44s both; }
.popular > span { font-size: 14px; color: var(--muted); font-weight: 500; }
.hero-star { position: absolute; width: min(760px, 120vw); aspect-ratio: 1; left: 50%; top: 0; translate: -50% -18%; opacity: .5; pointer-events: none; z-index: -1; animation: spin 160s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }

/* Product marquee */
.marquee { margin-top: clamp(40px, 6vw, 72px); overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); padding-block: 16px 30px; }
.marquee-track { display: flex; gap: 18px; width: max-content; animation: marquee 70s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }
.mcard { position: relative; width: 250px; height: 320px; border-radius: var(--r-lg); overflow: hidden; flex: none; background: hsl(var(--h) var(--tile-s) var(--tile-l1)); color: hsl(var(--h) 45% var(--tile-ink)); display: grid; place-items: center; box-shadow: 0 20px 40px -22px rgba(0, 0, 0, .45); transition: transform .5s var(--ease); }
.mcard > .icon { width: 64px; height: 64px; stroke-width: 1.2; position: absolute; }
.mcard:hover { transform: translateY(-6px) scale(1.02); }
.mcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.mcard:hover img { transform: scale(1.08); }
.mcard-label { position: absolute; inset: auto 10px 10px; padding: 11px 13px; border-radius: 16px; background: rgba(255, 255, 255, .62); -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%); border: 1px solid rgba(255, 255, 255, .7); color: #1D1D1F; display: grid; gap: 1px; text-align: start; }
.mcard-label b { font-size: 14px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.mcard-label span { font-size: 12px; color: #515154; }

/* Bento */
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(180px, auto); gap: 18px; }
.tile { padding: 26px; display: grid; align-content: space-between; gap: 14px; overflow: hidden; min-width: 0; }
.tile-label { font-size: 15px; color: var(--muted); font-weight: 500; line-height: 1.35; }

.tile-num.xl { font-size: clamp(52px, 7vw, 96px); }
.t-map { grid-column: span 2; grid-row: span 2; align-content: start; }
.t-map svg { width: 100%; height: auto; max-height: 360px; margin-top: 4px; }
.t-wide { grid-column: span 2; }
.t-ring { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; align-content: center; gap: 18px; }
.ring { width: 96px; height: 96px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 6.5; stroke-linecap: round; }
.ring .ring-bg { stroke: var(--green-wash); }
.ring .ring-fg { stroke: url(#ringGrad); stroke-dasharray: calc(var(--p) * 100) 100; }
.in .ring-fg, .ring-fg.run { animation: ring 1.8s var(--ease) both; }
@keyframes ring { from { stroke-dasharray: 0 100; } }
.source { font-size: 13px; color: var(--muted); margin-top: 14px; }
@media (max-width: 900px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } .t-map { grid-row: span 1; } }
@media (max-width: 520px) { .bento { grid-template-columns: minmax(0, 1fr); } .t-map, .t-wide { grid-column: span 1; } }

/* Map */
.jo-land { fill: var(--green-wash); stroke: var(--green); stroke-width: 1.5; stroke-linejoin: round; }
.jo-sea { fill: var(--water); }
.jo-dot { fill: var(--green); stroke: var(--glass-solid); stroke-width: 2.5; filter: drop-shadow(0 0 6px var(--green)); }
.jo-dot.sel { fill: var(--red); filter: drop-shadow(0 0 8px var(--red)); }
.jo-pulse { fill: none; stroke: var(--green); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-out infinite; opacity: 0; }
@keyframes pulse { 0% { transform: scale(.6); opacity: .9; } 70% { transform: scale(3.4); opacity: 0; } 100% { opacity: 0; } }
.jo-label { font: 600 14px var(--f-sans); fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.jo-label-sub { font: 500 11.5px var(--f-sans); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }

/* Sector shelf */
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 270px; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: max(16px, calc((100% - 1168px) / 2)); padding-inline: max(16px, calc((100% - 1168px) / 2)); padding-block: 8px 34px; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.shelf-nav { display: flex; gap: 10px; }
.shelf-nav button { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.scard { position: relative; height: 380px; border-radius: var(--r-xl); overflow: hidden; scroll-snap-align: start; border: 0; padding: 0; text-align: start; background: linear-gradient(150deg, hsl(var(--h) 45% 38%), hsl(var(--h) 45% 20%)); color: #fff; box-shadow: 0 24px 44px -26px rgba(0, 0, 0, .55); }
.scard > .icon { position: absolute; width: 120px; height: 120px; stroke-width: 1; opacity: .35; inset: auto auto 40px 50%; translate: -50% 0; }
.scard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.scard:hover img { transform: scale(1.07); }
.scard::before { content: ""; position: absolute; inset: 0; background: var(--photo-shade); z-index: 1; }
.scard-top { position: absolute; inset: 24px 24px auto; z-index: 2; display: grid; gap: 6px; }
.scard-top b { font-size: 24px; line-height: 1.12; letter-spacing: -.025em; font-weight: 700; text-shadow: 0 1px 12px rgba(0, 0, 0, .3); }
:lang(ar) .scard-top b { letter-spacing: 0; }
.scard-top span { font-size: 14px; opacity: .9; font-weight: 500; }
.scard-go { position: absolute; inset: auto 18px 18px auto; z-index: 2; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .25); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .4); }
[dir="rtl"] .scard-go { inset: auto auto 18px 18px; }
.scard-go .icon { width: 18px; height: 18px; stroke-width: 2.2; }

/* Product cards */
.products { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.pcard { display: grid; grid-template-rows: auto 1fr; padding: 10px; border-radius: var(--r-lg); }
.photo { position: relative; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 18px; overflow: hidden; background: linear-gradient(140deg, hsl(var(--h) var(--tile-s) var(--tile-l1)), hsl(var(--h) var(--tile-s) var(--tile-l2))); color: hsl(var(--h) 45% var(--tile-ink)); display: grid; place-items: center; isolation: isolate; }
.photo > .icon { width: 56px; height: 56px; stroke-width: 1.2; position: absolute; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s var(--ease); }
.pcard:hover .photo img, .fcard:hover .photo img, .opp:hover .photo img { transform: scale(1.06); }
.photo-chip { position: absolute; top: 10px; z-index: 1; font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: rgba(255, 255, 255, .72); -webkit-backdrop-filter: blur(12px) saturate(180%); backdrop-filter: blur(12px) saturate(180%); color: #1D1D1F; letter-spacing: 0; }
.photo-chip.hs { inset-inline-start: 10px; font-family: var(--f-mono); font-weight: 500; }
.photo-chip.sample { inset-inline-end: 10px; color: #515154; }
.pcard-body { padding: 14px 8px 8px; display: grid; gap: 5px; align-content: start; }
.pcard-sector { font-size: 12.5px; color: var(--green); font-weight: 600; }
.pcard-name { font-weight: 600; font-size: 18px; line-height: 1.25; letter-spacing: -.02em; }
:lang(ar) .pcard-name { letter-spacing: 0; }
.pcard-factory { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; min-width: 0; }
.pcard-factory .icon { width: 15px; height: 15px; color: var(--green); }
.pcard-factory span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard-price { margin-top: 8px; font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.pcard-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

/* Who + dark band */
.who { padding: 30px; display: grid; gap: 14px; align-content: start; }
.who p { color: var(--muted); }
.band { position: relative; background: var(--band-bg); color: var(--band-ink); overflow: hidden; isolation: isolate; }
.band::before, .band::after { content: ""; position: absolute; border-radius: 50%; filter: blur(100px); z-index: -1; pointer-events: none; }
.band::before { width: 60vmax; height: 60vmax; background: #0E7A4E; opacity: .55; top: -30vmax; inset-inline-start: -20vmax; animation: drift-a 30s ease-in-out infinite alternate; }
.band::after { width: 50vmax; height: 50vmax; background: #8A6420; opacity: .4; bottom: -30vmax; inset-inline-end: -16vmax; animation: drift-b 36s ease-in-out infinite alternate; }
.band-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .2; z-index: -2; filter: saturate(.8); }
.band .kicker { color: #6EE7AE; }
.band .lead, .band .muted { color: var(--band-muted); }
.band-glass { position: relative; background: var(--band-glass); border: 1px solid var(--band-edge); -webkit-backdrop-filter: blur(26px) saturate(160%); backdrop-filter: blur(26px) saturate(160%); border-radius: var(--r-lg); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 30px 60px -30px rgba(0, 0, 0, .8); --specular: rgba(255, 255, 255, .12); }
.band-glass.hl-card { background: linear-gradient(150deg, rgba(14, 160, 100, .45), rgba(10, 90, 60, .25)); border-color: rgba(110, 231, 174, .35); }
.band .btn-glass { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .2); color: #fff; box-shadow: none; }
.band .partner { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.band .partner .card { padding: 30px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }
.cta-row.center { justify-content: center; }
@media (max-width: 860px) { .band .partner { grid-template-columns: minmax(0, 1fr); } }

/* Search page */
.search-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 26px; align-items: start; padding-block: 24px 60px; }
.filters { padding: 22px; display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
.field { display: grid; gap: 7px; min-width: 0; }
.field label, .field .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input, .field select, .field textarea { width: 100%; min-height: 44px; padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--glass-solid); font-size: 15px; transition: border-color .2s, box-shadow .2s; }
.field select { appearance: auto; }
.field textarea { min-height: 96px; resize: vertical; }
.input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 4px var(--green-wash); }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--green); }
.results-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.results-bar .search { flex: 1 1 320px; }
.results-count { font-weight: 600; font-size: 15px; color: var(--muted); margin-bottom: 14px; }

@media (max-width: 900px) {
  .search-layout { grid-template-columns: minmax(0, 1fr); }

  .filters[data-open="true"] { display: grid; }

}

/* Product page */
.p-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 34px; padding-block: 18px 10px; align-items: start; }

.p-head { display: grid; gap: 16px; align-content: start; padding-top: 8px; }

.stars { display: inline-flex; gap: 2px; color: var(--gold); }

.price-box { padding: 20px 22px; display: grid; gap: 6px; border-radius: var(--r-md); }
.price-big { font-size: clamp(28px, 3.2vw, 40px); font-weight: 700; letter-spacing: -.035em; font-variant-numeric: tabular-nums; line-height: 1.1; }

.price-big.req { font-size: 28px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.p-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.panel { padding: 26px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

.certs { display: flex; flex-wrap: wrap; gap: 8px; }
.cert { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 12px; background: var(--glass-solid); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600; }

.verified { display: flex; gap: 14px; padding: 16px; border-radius: var(--r-md); background: var(--green-wash); }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

@media (max-width: 860px) { .p-top, .p-detail { grid-template-columns: minmax(0, 1fr); } .p-photo { position: static; } }

/* Factory */
.f-cover { position: relative; height: clamp(220px, 32vw, 360px); border-radius: var(--r-xl); overflow: hidden; margin-top: 18px; background: linear-gradient(150deg, hsl(var(--h) 45% 38%), hsl(var(--h) 45% 20%)); }

.f-avatar { width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; background: linear-gradient(140deg, hsl(var(--h) var(--tile-s) var(--tile-l1)), hsl(var(--h) var(--tile-s) var(--tile-l2))); color: hsl(var(--h) 45% var(--tile-ink)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); flex: none; }

.f-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.4fr); gap: 16px; }
.kpi { padding: 20px 22px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.kpi-label { font-size: 14px; color: var(--muted); font-weight: 500; }

:lang(ar) .kpi-val { letter-spacing: 0; }
.kpi-val.kpi-sm { font-size: clamp(24px, 2.4vw, 30px); white-space: nowrap; }
.f-stats .kpi-val { font-size: clamp(24px, 2.5vw, 34px); white-space: nowrap; }
.kpi.ring-kpi { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 16px; }

.f-body { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 20px; align-items: start; }
.f-body aside svg { max-height: 240px; width: 100%; }
.fcard { display: grid; gap: 14px; padding: 10px 10px 20px; align-content: start; }
.fcard .photo { aspect-ratio: 16 / 9; }
.fcard-in { display: grid; gap: 12px; padding: 4px 10px 0; }
.fcard-top { display: flex; gap: 12px; align-items: center; }
.fcard-top .f-avatar { width: 48px; height: 48px; border-radius: 14px; }
.fcard-top .f-avatar .icon { width: 24px; height: 24px; }
